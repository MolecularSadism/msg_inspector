[package]
name = "msg_inspector"
version = "0.3.1"
edition = "2024"
description = "A generic, modular Bevy UI framework for development panels and inspectors"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/msg_inspector"
keywords = ["bevy", "inspector", "debug", "egui", "gamedev"]
categories = ["game-development", "gui", "development-tools::debugging"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_window",
    "bevy_winit",
    "bevy_gizmos",
    "bevy_pbr",
] }
bevy-inspector-egui = "0.36"
bevy_egui = { version = "0.39.1" }
egui_dock = "0.18"
sublime_fuzzy = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[dev-dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_window",
    "bevy_winit",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_state",
    "bevy_text",
] }
